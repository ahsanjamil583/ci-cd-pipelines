name: CI Pipeline

run-name: CI - ${{ github.event_name }} - ${{ github.ref_name }}

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  CI: "true"
  REGISTRY: ghcr.io

jobs:
  # =================================================
  # Job 1: Validate Node.js source code
  # =================================================
  validate:
    name: Lint and test

    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Display runtime versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Run tests with coverage
        run: npm test -- --coverage --runInBand

      - name: Verify coverage report
        run: |
          test -f coverage/lcov.info
          echo "Coverage report generated successfully."

      - name: Upload coverage artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: coverage/
          if-no-files-found: warn
          retention-days: 7

  # =================================================
  # Job 2: Build and verify Docker container
  # =================================================
  docker:
    name: Build and verify container

    needs:
      - validate

    runs-on: ubuntu-latest

    timeout-minutes: 20

    env:
      IMAGE_NAME: health-api:${{ github.sha }}
      CONTAINER_NAME: health-api-ci
      HOST_PORT: "3001"
      HEALTH_URL: http://127.0.0.1:3001/health

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js for JSON verification
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Display Docker information
        run: |
          docker --version
          docker info

      - name: Build production Docker image
        run: |
          docker build \
            --target production \
            --tag "$IMAGE_NAME" \
            .

      - name: Verify Docker image exists
        run: |
          docker image inspect "$IMAGE_NAME" > /dev/null
          echo "Docker image created: $IMAGE_NAME"

      - name: Run application container
        run: |
          docker rm -f "$CONTAINER_NAME" 2>/dev/null || true

          docker run \
            --detach \
            --name "$CONTAINER_NAME" \
            --publish "127.0.0.1:${HOST_PORT}:3000" \
            "$IMAGE_NAME"

          docker ps \
            --filter "name=$CONTAINER_NAME"

      - name: Wait for application readiness
        run: |
          echo "Waiting for application at $HEALTH_URL"

          for attempt in $(seq 1 30); do
            if curl \
              --fail \
              --silent \
              --show-error \
              "$HEALTH_URL" \
              --output /tmp/health-response.json
            then
              echo "Application responded successfully."
              cat /tmp/health-response.json
              exit 0
            fi

            if ! docker ps \
              --format '{{.Names}}' \
              | grep -qx "$CONTAINER_NAME"
            then
              echo "Container stopped before becoming ready."
              exit 1
            fi

            echo "Attempt ${attempt}/30 failed. Retrying in 2 seconds..."
            sleep 2
          done

          echo "Application did not become ready within 60 seconds."
          exit 1

      - name: Verify exact health response
        run: |
          node <<'NODE'
          const fs = require("fs");

          const responsePath = "/tmp/health-response.json";
          const rawResponse = fs.readFileSync(responsePath, "utf8");
          const body = JSON.parse(rawResponse);

          const keys = Object.keys(body);
          const isExactResponse =
            keys.length === 1 &&
            keys[0] === "status" &&
            body.status === "healthy";

          if (!isExactResponse) {
            console.error(
              `Unexpected health response: ${JSON.stringify(body)}`,
            );
            process.exit(1);
          }

          console.log(
            `Health response verified: ${JSON.stringify(body)}`,
          );
          NODE

      - name: Display container status
        run: |
          docker ps \
            --filter "name=$CONTAINER_NAME" \
            --format \
            'Container={{.Names}} Status={{.Status}} Ports={{.Ports}}'

          docker inspect \
            --format='Running={{.State.Running}} Health={{if .State.Health}}{{.State.Health.Status}}{{else}}not-configured{{end}}' \
            "$CONTAINER_NAME"

      - name: Collect Docker diagnostics on failure
        if: ${{ failure() }}
        run: |
          mkdir -p reports/docker

          docker ps -a \
            > reports/docker/docker-ps.txt

          docker logs "$CONTAINER_NAME" \
            > reports/docker/container.log \
            2>&1 || true

          docker inspect "$CONTAINER_NAME" \
            > reports/docker/container-inspect.json \
            2>&1 || true

          echo "Docker diagnostics collected."

      - name: Show container logs on failure
        if: ${{ failure() }}
        run: |
          echo "========== Container logs =========="

          docker logs "$CONTAINER_NAME" || true

          echo "========== Container status =========="

          docker ps -a || true

      - name: Upload Docker diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: docker-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/docker/
          if-no-files-found: warn
          retention-days: 7

      - name: Cleanup Docker container
        if: ${{ always() }}
        run: |
          docker rm -f "$CONTAINER_NAME" 2>/dev/null || true
          echo "Container cleanup completed."

  # =================================================
  # Job 3: SonarQube analysis and Quality Gate
  # =================================================
  sonarqube:
    name: SonarQube quality gate

    needs:
      - docker

    runs-on: ubuntu-latest

    timeout-minutes: 30

    env:
      SONAR_HOST_URL: http://127.0.0.1:9000
      SONAR_PORT: "9000"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm test -- --coverage --runInBand

      - name: Verify LCOV coverage report
        run: |
          test -f coverage/lcov.info
          echo "Coverage report is ready for SonarQube."

      - name: Configure SonarQube host limits
        run: |
          sudo sysctl -w vm.max_map_count=524288
          sudo sysctl -w fs.file-max=131072

          sysctl vm.max_map_count
          sysctl fs.file-max

      - name: Start PostgreSQL and SonarQube
        run: |
          SONAR_DB_PASSWORD="$(openssl rand -hex 24)"

          echo "::add-mask::$SONAR_DB_PASSWORD"
          echo "SONAR_DB_PASSWORD=$SONAR_DB_PASSWORD" >> "$GITHUB_ENV"

          export SONAR_DB_PASSWORD

          docker compose \
            -f compose.ci.yaml \
            up -d db sonarqube

          docker compose \
            -f compose.ci.yaml \
            ps

      - name: Wait until SonarQube is ready
        run: |
          echo "Waiting for SonarQube at $SONAR_HOST_URL"

          for attempt in $(seq 1 120); do
            RESPONSE="$(
              curl \
                --fail \
                --silent \
                "$SONAR_HOST_URL/api/system/status" \
                2>/dev/null || true
            )"

            if echo "$RESPONSE" | grep -q '"status":"UP"'; then
              echo "SonarQube is ready."
              echo "$RESPONSE"
              exit 0
            fi

            echo "Attempt ${attempt}/120: SonarQube is not ready yet."
            sleep 5
          done

          echo "SonarQube did not become ready within 10 minutes."
          exit 1

      - name: Generate temporary SonarQube token
        run: |
          TOKEN_RESPONSE="$(
            curl \
              --fail \
              --silent \
              --show-error \
              --user admin:admin \
              --request POST \
              --data-urlencode \
                "name=github-actions-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
              "$SONAR_HOST_URL/api/user_tokens/generate"
          )"

          SONAR_TOKEN="$(
            printf '%s' "$TOKEN_RESPONSE" |
              node -e '
                const fs = require("fs");
                const response = JSON.parse(
                  fs.readFileSync(0, "utf8"),
                );

                if (!response.token) {
                  console.error("SonarQube token was not returned.");
                  process.exit(1);
                }

                process.stdout.write(response.token);
              '
          )"

          test -n "$SONAR_TOKEN"

          echo "::add-mask::$SONAR_TOKEN"
          echo "SONAR_TOKEN=$SONAR_TOKEN" >> "$GITHUB_ENV"

          echo "Temporary SonarQube token generated securely."

      - name: Create SonarQube project
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --user "${SONAR_TOKEN}:" \
            --request POST \
            --data-urlencode \
              "project=devops-ci-cd-health-api" \
            --data-urlencode \
              "name=DevOps CI/CD Health API" \
            "$SONAR_HOST_URL/api/projects/create"

          echo
          echo "SonarQube project created."

      - name: Run SonarQube analysis
        run: npm run sonar

      - name: Save Quality Gate result
        if: ${{ always() }}
        run: |
          mkdir -p reports/sonar

          if [ -n "${SONAR_TOKEN:-}" ]; then
            curl \
              --fail \
              --silent \
              --show-error \
              --user "${SONAR_TOKEN}:" \
              "$SONAR_HOST_URL/api/qualitygates/project_status?projectKey=devops-ci-cd-health-api" \
              > reports/sonar/quality-gate.json \
              || true
          fi

          if [ -f reports/sonar/quality-gate.json ]; then
            cat reports/sonar/quality-gate.json
            echo
          fi

      - name: Collect SonarQube diagnostics
        if: ${{ always() }}
        run: |
          mkdir -p reports/sonar

          docker compose \
            -f compose.ci.yaml \
            ps -a \
            > reports/sonar/compose-status.txt \
            2>&1 || true

          docker compose \
            -f compose.ci.yaml \
            logs sonarqube \
            > reports/sonar/sonarqube.log \
            2>&1 || true

          docker compose \
            -f compose.ci.yaml \
            logs db \
            > reports/sonar/postgres.log \
            2>&1 || true

      - name: Show SonarQube logs on failure
        if: ${{ failure() }}
        run: |
          echo "========== SonarQube logs =========="

          docker compose \
            -f compose.ci.yaml \
            logs --tail 200 sonarqube \
            || true

          echo "========== PostgreSQL logs =========="

          docker compose \
            -f compose.ci.yaml \
            logs --tail 100 db \
            || true

      - name: Upload SonarQube reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: sonar-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/sonar/
          if-no-files-found: warn
          retention-days: 7

      - name: Stop SonarQube stack
        if: ${{ always() }}
        run: |
          docker compose \
            -f compose.ci.yaml \
            down --volumes --remove-orphans

          echo "Temporary SonarQube stack removed."


  # =================================================
  # Job 4: Publish validated image to GHCR
  # =================================================
  publish:
    name: Publish image to GHCR

    needs:
      - validate
      - docker
      - sonarqube

    if: ${{ startsWith(github.ref, 'refs/tags/v') }}

    runs-on: ubuntu-latest

    timeout-minutes: 20

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Prepare image names and tags
        shell: bash
        run: |
          VERSION_TAG="$GITHUB_REF_NAME"

          if [[ ! "$VERSION_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $VERSION_TAG"
            echo "Expected format: v1.0.0"
            exit 1
          fi

          REPOSITORY_NAME="${GITHUB_REPOSITORY,,}"
          IMAGE_NAME="${REGISTRY}/${REPOSITORY_NAME}"
          SHA_TAG="$GITHUB_SHA"

          echo "IMAGE_NAME=$IMAGE_NAME" >> "$GITHUB_ENV"
          echo "VERSION_TAG=$VERSION_TAG" >> "$GITHUB_ENV"
          echo "SHA_TAG=$SHA_TAG" >> "$GITHUB_ENV"

          echo "Image: $IMAGE_NAME"
          echo "Version tag: $VERSION_TAG"
          echo "Commit SHA tag: $SHA_TAG"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build release Docker image
        run: |
          docker build \
            --target production \
            --label \
              "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label \
              "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label \
              "org.opencontainers.image.version=${VERSION_TAG}" \
            --tag "${IMAGE_NAME}:${VERSION_TAG}" \
            --tag "${IMAGE_NAME}:${SHA_TAG}" \
            .

      - name: Verify release image tags
        run: |
          docker image inspect \
            "${IMAGE_NAME}:${VERSION_TAG}" \
            > /dev/null

          docker image inspect \
            "${IMAGE_NAME}:${SHA_TAG}" \
            > /dev/null

          echo "Both local image tags exist."

      - name: Push version image
        run: |
          docker push "${IMAGE_NAME}:${VERSION_TAG}"

      - name: Push commit SHA image
        run: |
          docker push "${IMAGE_NAME}:${SHA_TAG}"

      - name: Verify published images
        run: |
          docker buildx imagetools inspect \
            "${IMAGE_NAME}:${VERSION_TAG}"

          docker buildx imagetools inspect \
            "${IMAGE_NAME}:${SHA_TAG}"

      - name: Write publishing summary
        run: |
          {
            echo "## GHCR Publishing Successful"
            echo
            echo "- Version image: \`${IMAGE_NAME}:${VERSION_TAG}\`"
            echo "- Commit image: \`${IMAGE_NAME}:${SHA_TAG}\`"
            echo "- Source commit: \`${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Log out from GHCR
        if: ${{ always() }}
        run: |
          docker logout "$REGISTRY" || true
