name: CI Pipeline

run-name: CI - ${{ github.event_name }} - ${{ github.ref_name }}

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  CI: "true"

jobs:
  validate:
    name: Lint and test

    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Display runtime versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Run tests with coverage
        run: npm test -- --coverage --runInBand

      - name: Verify coverage report
        run: |
          test -f coverage/lcov.info
          echo "Coverage report generated successfully."

      - name: Upload coverage artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ github.run_id }}
          path: coverage/
          if-no-files-found: warn
          retention-days: 7

  release_preview:
    name: Release condition check

    needs:
      - validate

    if: ${{ startsWith(github.ref, 'refs/tags/v') }}

    runs-on: ubuntu-latest

    steps:
      - name: Show release information
        run: |
          echo "Version tag: $GITHUB_REF_NAME"
          echo "Commit SHA: $GITHUB_SHA"
          echo "Validation passed."
          echo "Docker publishing will be added in the GHCR phase."
