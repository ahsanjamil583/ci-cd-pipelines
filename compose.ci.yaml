name: sonar-ci

services:
  db:
    image: postgres:17-alpine

    environment:
      POSTGRES_DB: sonar
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD:?SONAR_DB_PASSWORD is required}

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U sonar -d sonar
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 10s

    networks:
      - sonar-ci-network

  sonarqube:
    image: sonarqube:26.6.0.123539-community

    depends_on:
      db:
        condition: service_healthy

    environment:
      SONAR_JDBC_URL: jdbc:postgresql://db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD:?SONAR_DB_PASSWORD is required}

    ports:
      - "127.0.0.1:${SONAR_PORT:-9000}:9000"

    ulimits:
      nofile:
        soft: 131072
        hard: 131072
      nproc: 8192

    networks:
      - sonar-ci-network

networks:
  sonar-ci-network:
    driver: bridge
